<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catch the Hearts ❤️</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;

    background:
        radial-gradient(circle at 15% 20%, #ffe0eb, transparent 30%),
        radial-gradient(circle at 85% 80%, #e5dcff, transparent 30%),
        #fff9f6;

    color: #4b3540;
    font-family: Georgia, serif;
}


/* =====================================================
   BACKGROUND HEARTS
===================================================== */

.background-heart {
    position: fixed;

    color: rgba(220, 100, 140, 0.10);

    font-size: 90px;

    pointer-events: none;

    animation:
        floatBackground
        6s ease-in-out infinite;
}

.h1 {
    top: 8%;
    left: 7%;
}

.h2 {
    top: 72%;
    left: 12%;
    animation-delay: 1s;
}

.h3 {
    top: 14%;
    right: 9%;
    animation-delay: 2s;
}

.h4 {
    bottom: 8%;
    right: 13%;
    animation-delay: 3s;
}

@keyframes floatBackground {

    0%, 100% {
        transform:
            translateY(0)
            rotate(-8deg);
    }

    50% {
        transform:
            translateY(-20px)
            rotate(8deg);
    }
}


/* =====================================================
   GAME
===================================================== */

.game {
    position: relative;

    width: 100%;
    height: 100vh;
}


/* =====================================================
   TYPEWRITER HEADINGS
===================================================== */

.typewriter {
    display: inline-block;

    overflow: hidden;

    white-space: nowrap;

    width: 0;

    border-right:
        3px solid #4b3540;

    animation:
        typing 2.5s steps(30, end) forwards,
        blinkCursor 0.75s step-end infinite;
}

@keyframes typing {

    from {
        width: 0;
    }

    to {
        width: 100%;
    }
}

@keyframes blinkCursor {

    0%, 100% {
        border-color: transparent;
    }

    50% {
        border-color: #4b3540;
    }
}


/* =====================================================
   HEADER
===================================================== */

.header {
    position: absolute;

    top: 40px;
    left: 50%;

    transform: translateX(-50%);

    width: 90%;

    text-align: center;

    z-index: 5;

    pointer-events: none;
}

.header h1 {
    font-size:
        clamp(38px, 6vw, 65px);

    font-weight: normal;

    letter-spacing: -2px;
}

.header p {
    margin-top: 12px;

    font-family: Arial, sans-serif;

    font-size: 14px;

    line-height: 1.6;

    opacity: 0.65;
}

.counter {
    display: inline-block;

    margin-top: 15px;

    padding: 8px 18px;

    border-radius: 30px;

    background:
        rgba(255,255,255,0.65);

    backdrop-filter: blur(10px);

    font-family: Arial, sans-serif;

    font-size: 14px;
}


/* =====================================================
   MOVING HEART
===================================================== */

.heart {
    position: fixed;

    width: 80px;
    height: 80px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 62px;

    cursor: pointer;

    user-select: none;

    z-index: 20;

    filter:
        drop-shadow(
            0 10px 15px
            rgba(190,70,110,0.28)
        );

    animation:
        heartAppear
        0.4s ease;

    transition:
        transform 0.12s ease;
}

.heart:hover {
    transform:
        scale(1.25);
}

.heart.clicked {
    pointer-events: none;

    animation:
        heartDisappear
        0.45s
        forwards;
}

@keyframes heartAppear {

    from {
        opacity: 0;
        transform: scale(0);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes heartDisappear {

    0% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        transform:
            scale(1.5)
            rotate(15deg);
    }

    100% {
        opacity: 0;
        transform: scale(0);
    }
}


/* =====================================================
   APPRECIATION
===================================================== */

.appreciation {
    position: fixed;

    left: 50%;
    top: 52%;

    transform:
        translate(-50%, -50%);

    width: min(600px, 85%);

    text-align: center;

    font-size:
        clamp(22px, 4vw, 34px);

    line-height: 1.4;

    opacity: 0;

    pointer-events: none;

    z-index: 30;
}

.appreciation.show {
    animation:
        messageIn
        1.7s
        ease
        forwards;
}

@keyframes messageIn {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -40%)
            scale(0.8);
    }

    20% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }

    75% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%, -60%)
            scale(1.05);
    }
}


/* =====================================================
   SPARKLES
===================================================== */

.sparkle {
    position: fixed;

    pointer-events: none;

    z-index: 50;

    font-size: 20px;

    animation:
        sparkle
        0.8s
        ease
        forwards;
}

@keyframes sparkle {

    from {
        opacity: 1;

        transform:
            translate(0,0)
            scale(1);
    }

    to {
        opacity: 0;

        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(0.2);
    }
}


/* =====================================================
   MASSIVE FINAL HEART
===================================================== */

.final-heart {
    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(0);

    font-size:
        min(60vw, 700px);

    line-height: 1;

    z-index: 100;

    pointer-events: none;

    filter:
        drop-shadow(
            0 0 35px
            rgba(255,70,120,0.55)
        )
        drop-shadow(
            0 0 100px
            rgba(255,100,150,0.4)
        );

    animation:
        massiveHeart
        3s
        cubic-bezier(.17,.67,.22,1.2)
        forwards;
}

@keyframes massiveHeart {

    0% {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            scale(0);
    }

    12% {
        opacity: 1;

        transform:
            translate(-50%,-50%)
            scale(0.3);
    }

    30% {
        transform:
            translate(-50%,-50%)
            scale(0.9);
    }

    45% {
        transform:
            translate(-50%,-50%)
            scale(1.1);
    }

    55% {
        transform:
            translate(-50%,-50%)
            scale(0.95);
    }

    65% {
        transform:
            translate(-50%,-50%)
            scale(1.2);
    }

    78% {
        transform:
            translate(-50%,-50%)
            scale(1.5);

        opacity: 1;
    }

    100% {
        transform:
            translate(-50%,-50%)
            scale(4);

        opacity: 0;
    }
}


/* =====================================================
   EXPLOSION HEARTS
===================================================== */

.explosion-heart {
    position: fixed;

    left: 50%;
    top: 50%;

    font-size: 30px;

    z-index: 110;

    pointer-events: none;

    animation:
        explodeHeart
        1.8s
        cubic-bezier(.15,.7,.2,1)
        forwards;
}

@keyframes explodeHeart {

    0% {
        opacity: 1;

        transform:
            translate(-50%,-50%)
            scale(0);
    }

    15% {
        transform:
            translate(-50%,-50%)
            scale(1.5);
    }

    100% {
        opacity: 0;

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            rotate(var(--rotation))
            scale(0.3);
    }
}


/* =====================================================
   FLASH
===================================================== */

.explosion-flash {
    position: fixed;

    inset: 0;

    background: white;

    z-index: 90;

    pointer-events: none;

    animation:
        flash
        0.7s
        ease-out
        forwards;
}

@keyframes flash {

    0% {
        opacity: 0;
    }

    15% {
        opacity: 0.95;
    }

    100% {
        opacity: 0;
    }
}


/* =====================================================
   SHOCKWAVE
===================================================== */

.shockwave {
    position: fixed;

    left: 50%;
    top: 50%;

    width: 100px;
    height: 100px;

    border:
        6px solid
        rgba(255,100,150,0.7);

    border-radius: 50%;

    transform:
        translate(-50%,-50%)
        scale(0);

    z-index: 95;

    pointer-events: none;

    animation:
        shockwave
        1.3s
        ease-out
        forwards;
}

@keyframes shockwave {

    0% {
        opacity: 1;

        transform:
            translate(-50%,-50%)
            scale(0);
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            scale(18);
    }
}


/* =====================================================
   CONFETTI
===================================================== */

.confetti {
    position: fixed;

    left: 50%;
    top: 50%;

    z-index: 115;

    pointer-events: none;

    animation:
        confettiExplosion
        2s
        ease-out
        forwards;
}

@keyframes confettiExplosion {

    0% {
        opacity: 1;

        transform:
            translate(-50%,-50%)
            rotate(0deg);
    }

    100% {
        opacity: 0;

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            rotate(var(--rotation));
    }
}


/* =====================================================
   FINAL SCREEN
===================================================== */

.final-screen {
    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        rgba(255,249,246,0.94);

    backdrop-filter: blur(18px);

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 1s ease;

    z-index: 200;
}

.final-screen.show {
    opacity: 1;

    visibility: visible;
}

.final-card {
    width: min(600px,88%);

    padding: 55px 35px;

    text-align: center;

    background:
        rgba(255,255,255,0.8);

    border-radius: 35px;

    box-shadow:
        0 30px 100px
        rgba(80,40,60,0.15);

    transform:
        translateY(40px)
        scale(0.95);

    transition:
        transform 1s ease;
}

.final-screen.show .final-card {
    transform:
        translateY(0)
        scale(1);
}

.final-card .emoji {
    font-size: 85px;

    animation:
        heartbeat
        1.3s
        infinite;
}

.final-card h2 {
    margin-top: 18px;

    font-size:
        clamp(32px,5vw,48px);

    font-weight: normal;
}

.final-card p {
    margin-top: 20px;

    font-family: Arial, sans-serif;

    font-size: 15px;

    line-height: 1.8;

    opacity: 0.7;
}

@keyframes heartbeat {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.12);
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px) {

    .header {
        top: 30px;
    }

    .header h1 {
        font-size: 40px;
    }

    .heart {
        font-size: 58px;
    }

    .final-heart {
        font-size: 80vw;
    }

    .final-card {
        padding: 40px 25px;
    }
}

</style>
</head>


<body>


<!-- =========================================
     BACKGROUND
========================================= -->

<div class="background-heart h1">♡</div>
<div class="background-heart h2">♡</div>
<div class="background-heart h3">♡</div>
<div class="background-heart h4">♡</div>


<!-- =========================================
     GAME
========================================= -->

<main class="game" id="game">

    <div class="header">

        <h1>
            <span class="typewriter">
                Catch the Hearts
            </span>
        </h1>

        <p>
            A little game for someone special.
            <br>
            Catch all 10. ❤️
        </p>

        <div class="counter">

            ❤️
            <span id="score">0</span>
            / 10

        </div>

    </div>

</main>


<!-- =========================================
     APPRECIATION
========================================= -->

<div
    class="appreciation"
    id="appreciation">
</div>


<!-- =========================================
     FINAL SCREEN
========================================= -->

<section
    class="final-screen"
    id="finalScreen">

    <div class="final-card">

        <div class="emoji">
            ❤️
        </div>

        <h2>

            <span class="final-typewriter">
                You caught them all.

            </span>

        </h2>

        <p>

            And if you somehow haven't figured
            it out yet...

            <br><br>

            You're genuinely one of the people
            I'm really grateful to have in my life.

            <br><br>

            Thanks for being you. :)

        </p>

    </div>

</section>


<script>

/* =====================================================
   SETTINGS
===================================================== */

const totalHearts = 10;


/* =====================================================
   APPRECIATION MESSAGES
===================================================== */

const appreciationMessages = [

    "You're genuinely one of the kindest people I know. ❤️",

    "You somehow make even boring days fun.",

    "Your sense of humor is actually unmatched. 😂",

    "I'm really glad I got to know you.",

    "You make people feel comfortable being themselves.",

    "Thanks for always being there when it matters. 🤍",

    "Life is definitely more fun with you around.",

    "You're one of those people worth keeping around.",

    "Never forget how appreciated you are. ❤️",

    "And this one's for everything. You're awesome. 🫶"

];


/* =====================================================
   VARIABLES
===================================================== */

const game =
    document.getElementById("game");

const scoreText =
    document.getElementById("score");

const appreciation =
    document.getElementById("appreciation");

const finalScreen =
    document.getElementById("finalScreen");


let score = 0;

let heart = null;

let animationFrame;


/* =====================================================
   HEART POSITION
===================================================== */

let heartX = 300;

let heartY = 350;


/* =====================================================
   FASTER MOVEMENT
===================================================== */

/*
   These are deliberately FAST.

   Increase them even more if you want
   absolute chaos.
*/

let velocityX = 3.8;

let velocityY = 3.2;


/* =====================================================
   CREATE HEART
===================================================== */

function createHeart() {

    heart =
        document.createElement("div");

    heart.className =
        "heart";

    heart.textContent =
        "❤️";


    /*
       RANDOM START
    */

    const minX = 30;

    const maxX =
        window.innerWidth - 110;

    const minY = 210;

    const maxY =
        window.innerHeight - 110;


    heartX =
        Math.random() *
        (maxX - minX)
        + minX;


    heartY =
        Math.random() *
        (maxY - minY)
        + minY;


    /*
       RANDOM DIRECTION
    */

    velocityX =
        (Math.random() > 0.5 ? 1 : -1)
        *
        (3.2 + Math.random() * 2.2);


    velocityY =
        (Math.random() > 0.5 ? 1 : -1)
        *
        (3.0 + Math.random() * 2.2);


    heart.style.left =
        heartX + "px";

    heart.style.top =
        heartY + "px";


    heart.addEventListener(
        "click",
        handleHeartClick
    );


    game.appendChild(
        heart
    );


    moveHeart();
}


/* =====================================================
   HEART MOVEMENT
===================================================== */

function moveHeart() {

    if (!heart) return;


    const heartSize = 80;


    const leftLimit = 15;

    const rightLimit =
        window.innerWidth -
        heartSize -
        15;


    /*
       Don't enter header
    */

    const topLimit = 190;

    const bottomLimit =
        window.innerHeight -
        heartSize -
        15;


    /*
       MOVE
    */

    heartX += velocityX;

    heartY += velocityY;


    /*
       LEFT / RIGHT BOUNCE
    */

    if (
        heartX <= leftLimit ||
        heartX >= rightLimit
    ) {

        velocityX *= -1;

        /*
           Tiny random variation
        */

        velocityY +=
            (Math.random() - 0.5) * 0.8;
    }


    /*
       TOP / BOTTOM BOUNCE
    */

    if (
        heartY <= topLimit ||
        heartY >= bottomLimit
    ) {

        velocityY *= -1;

        velocityX +=
            (Math.random() - 0.5) * 0.8;
    }


    /*
       Keep speed within limits
    */

    const maxSpeed = 6;

    const minSpeed = 2.8;


    if (
        Math.abs(velocityX)
        > maxSpeed
    ) {

        velocityX =
            Math.sign(velocityX)
            * maxSpeed;
    }


    if (
        Math.abs(velocityY)
        > maxSpeed
    ) {

        velocityY =
            Math.sign(velocityY)
            * maxSpeed;
    }


    if (
        Math.abs(velocityX)
        < minSpeed
    ) {

        velocityX =
            Math.sign(velocityX)
            * minSpeed;
    }


    if (
        Math.abs(velocityY)
        < minSpeed
    ) {

        velocityY =
            Math.sign(velocityY)
            * minSpeed;
    }


    /*
       Keep inside screen
    */

    heartX =
        Math.max(
            leftLimit,
            Math.min(
                heartX,
                rightLimit
            )
        );


    heartY =
        Math.max(
            topLimit,
            Math.min(
                heartY,
                bottomLimit
            )
        );


    /*
       APPLY POSITION
    */

    heart.style.left =
        heartX + "px";

    heart.style.top =
        heartY + "px";


    /*
       CONTINUE
    */

    animationFrame =
        requestAnimationFrame(
            moveHeart
        );
}


/* =====================================================
   CLICK
===================================================== */

function handleHeartClick(event) {

    if (
        heart.classList.contains(
            "clicked"
        )
    ) {
        return;
    }


    cancelAnimationFrame(
        animationFrame
    );


    score++;

    scoreText.textContent =
        score;


    createSparkles(
        event.clientX,
        event.clientY
    );


    showAppreciation(
        appreciationMessages[
            score - 1
        ]
    );


    /*
       FINAL HEART
    */

    if (
        score === totalHearts
    ) {

        heart.classList.add(
            "clicked"
        );


        setTimeout(() => {

            heart.remove();

            heart = null;

            finalExplosion();

        }, 450);


        return;
    }


    /*
       NORMAL HEART
    */

    heart.classList.add(
        "clicked"
    );


    setTimeout(() => {

        heart.remove();

        heart = null;

        createHeart();

    }, 450);
}


/* =====================================================
   APPRECIATION
===================================================== */

function showAppreciation(message) {

    appreciation.classList.remove(
        "show"
    );


    void appreciation.offsetWidth;


    appreciation.textContent =
        message;


    appreciation.classList.add(
        "show"
    );
}


/* =====================================================
   SPARKLES
===================================================== */

function createSparkles(x, y) {

    const symbols = [
        "✦",
        "♡",
        "✧",
        "♥",
        "·"
    ];


    for (
        let i = 0;
        i < 10;
        i++
    ) {

        const sparkle =
            document.createElement(
                "div"
            );


        sparkle.className =
            "sparkle";


        sparkle.textContent =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];


        sparkle.style.left =
            x + "px";


        sparkle.style.top =
            y + "px";


        sparkle.style.setProperty(
            "--x",
            (Math.random() - 0.5)
            * 170 + "px"
        );


        sparkle.style.setProperty(
            "--y",
            (Math.random() - 0.5)
            * 170 + "px"
        );


        document.body.appendChild(
            sparkle
        );


        setTimeout(() => {

            sparkle.remove();

        }, 800);
    }
}


/* =====================================================
   FINAL EXPLOSION
===================================================== */

function finalExplosion() {

    /*
       MASSIVE HEART
    */

    const finalHeart =
        document.createElement(
            "div"
        );


    finalHeart.className =
        "final-heart";


    finalHeart.textContent =
        "❤️";


    document.body.appendChild(
        finalHeart
    );


    /*
       WAIT UNTIL HEART IS HUGE
    */

    setTimeout(() => {

        /*
           FLASH
        */

        const flash =
            document.createElement(
                "div"
            );


        flash.className =
            "explosion-flash";


        document.body.appendChild(
            flash
        );


        setTimeout(() => {

            flash.remove();

        }, 700);


        /*
           SHOCKWAVE
        */

        const shockwave =
            document.createElement(
                "div"
            );


        shockwave.className =
            "shockwave";


        document.body.appendChild(
            shockwave
        );


        setTimeout(() => {

            shockwave.remove();

        }, 1300);


        /*
           MASSIVE HEART EXPLOSION
        */

        for (
            let i = 0;
            i < 180;
            i++
        ) {

            const particle =
                document.createElement(
                    "div"
                );


            particle.className =
                "explosion-heart";


            const symbols = [

                "❤️",
                "💗",
                "💖",
                "💞",
                "💕",
                "💓",
                "♡",
                "♥",
                "✦",
                "✧"

            ];


            particle.textContent =
                symbols[
                    Math.floor(
                        Math.random() *
                        symbols.length
                    )
                ];


            const angle =
                Math.random() *
                Math.PI *
                2;


            const distance =
                300 +
                Math.random() *
                900;


            const x =
                Math.cos(angle) *
                distance;


            const y =
                Math.sin(angle) *
                distance;


            const rotation =
                Math.random() *
                1440 -
                720;


            particle.style.setProperty(
                "--x",
                x + "px"
            );


            particle.style.setProperty(
                "--y",
                y + "px"
            );


            particle.style.setProperty(
                "--rotation",
                rotation + "deg"
            );


            particle.style.fontSize =
                15 +
                Math.random() *
                45 +
                "px";


            particle.style.animationDuration =
                1.2 +
                Math.random() *
                1.3 +
                "s";


            document.body.appendChild(
                particle
            );


            setTimeout(() => {

                particle.remove();

            }, 2600);
        }


        /*
           EXTRA CONFETTI
        */

        createConfetti();

    }, 2100);


    /*
       FINAL MESSAGE
    */

    setTimeout(() => {

        finalScreen.classList.add(
            "show"
        );


        /*
           Typewriter final heading
        */

        const finalHeading =
            document.querySelector(
                ".final-typewriter"
            );

function createConfetti() {

    const pieces = [

        "🎉",
        "✨",
        "💗",
        "💖",
        "❤️",
        "♡",
        "✦"

    ];

        i < 120;
        i++
    ) {

            document.createElement(
                "div"
            );


        piece.className =
            "confetti";


        piece.textContent =
            pieces[
                Math.floor(
                    Math.random() *
                    pieces.length
                )
            ];


        const angle =
            Math.random() *
            Math.PI *
            2;


        const distance =
            250 +
            Math.random() *
            1000;


        const x =
            Math.cos(angle) *
            distance;


        const y =
            Math.sin(angle) *
            distance;


        const rotation =
            Math.random() *
            1800 -
            900;


        piece.style.setProperty(
            "--x",
            x + "px"
        );


        piece.style.setProperty(
            "--y",
            y + "px"
        );


        piece.style.setProperty(
            "--rotation",
            rotation + "deg"
        );


        piece.style.fontSize =
            10 +
            Math.random() *
            25 +
            "px";


        piece.style.animationDuration =
            1.5 +
            Math.random() *
            1.5 +
            "s";


        document.body.appendChild(
            piece
        );


        setTimeout(() => {

            piece.remove();

        }, 3000);
    }
}
